name: Bug report
description: Wrong layout, crash, wrong view content or a rule that misfires
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [systemLandscape view, systemContext view, container view, component view, drill-down / navigation, rules / validation, viewer / CLI]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Minimal model JSON
      description: The smallest *.c4.json model that reproduces the problem, and the view key.
      render: json
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: e.g. `node bin/c4ify.mjs validate c4 model.c4.json --view containers --quality showcase --json`
      render: shell
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (for visual problems)
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "c4ify 0.1.0 · Node 22 · Windows 11 · Chrome 130"
