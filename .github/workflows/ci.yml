name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: c4ify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: c4ify/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node bin/c4ify.mjs doctor
      - name: Render every example
        run: node scripts/render-examples.mjs "${{ runner.temp }}/c4ify-examples"
